<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL PARK - 暇つぶしゲームサイト</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1016;
            --card-bg: #1a1c26;
            --accent-pink: #ff3366;
            --accent-cyan: #00f0ff;
            --text-main: #ffffff;
            --text-sub: #8b8fa3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', 'Zen Maru Gothic', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 420px;
        }

        .site-title {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .site-subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        main {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            transition: border-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .game-card:active {
            transform: scale(0.98);
        }

        .game-card:hover {
            border-color: var(--accent-cyan);
        }

        .game-info h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .game-info p {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .play-tag {
            align-self: flex-start;
            background: linear-gradient(135deg, var(--accent-cyan), #0077ff);
            color: #000;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 6px 14px;
            border-radius: 20px;
        }

        footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: var(--text-sub);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="site-title">PIXEL PARK</h1>
        <p class="site-subtitle">広告なし・純度100%の暇つぶしゲームポータル</p>
    </header>

    <main>
        <a href="./games/tower.html" class="game-card">
            <div class="game-info">
                <h2>タワービルド</h2>
                <p>左右に揺れるブロックをタイミングよくタップして、どこまで高く積めるか競うアクション。</p>
            </div>
            <span class="play-tag">遊ぶ &rarr;</span>
        </a>

        <a href="./games/stopwatch.html" class="game-card">
            <div class="game-info">
                <h2>10秒ストップ！</h2>
                <p>スタートを押して、ぴったり10.00秒でストップを押せ！体内時計チャレンジ。</p>
            </div>
            <span class="play-tag">遊ぶ &rarr;</span>
        </a>
    </main>

    <footer>
        <p>&copy; PIXEL PARK (No Ads)</p>
    </footer>

</body>
</html>
